# Since: 16/11/2026

[package]
name = "iris-overlay-helper"
description = "Iris's Linux overlay helper: layer-shell, else an X11 window"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "iris-overlay"
path = "src/main.rs"

# Linux only; elsewhere the binary is an empty `main`.
[target.'cfg(target_os = "linux")'.dependencies]
iris-overlay.workspace = true
slint.workspace = true
smithay-client-toolkit.workspace = true
# winit's copy; `shape` sets the X11 window's input region.
x11rb = { version = "~0.13.2", features = ["shape"] }
