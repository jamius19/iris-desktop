# Author: Jamius Siam
# Since: 16/11/2026

[workspace]
resolver = "3"
members = ["crates/iris", "crates/iris-core", "xtask"]
default-members = ["crates/iris", "crates/iris-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.92"

[workspace.dependencies]
iris-core = { path = "crates/iris-core" }
directories = "6"
handy-recorder = "~0.1.1"
keyring = "~4.2"
log = "0.4"
open = "5"
psl = "2"
reqwest = "~0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
slint = { version = "~1.18.1", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "software-renderer-systemfonts",
    "accessibility",
    "unstable-winit-030",
] }
slint-build = "~1.18.1"
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
