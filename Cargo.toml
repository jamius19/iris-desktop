# Author: Jamius Siam
# Since: 16/11/2026

[workspace]
resolver = "3"
members = ["crates/iris", "crates/iris-core", "crates/iris-overlay", "crates/iris-overlay-helper", "xtask"]
default-members = ["crates/iris", "crates/iris-core", "crates/iris-overlay", "crates/iris-overlay-helper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.92"

[workspace.dependencies]
iris-core = { path = "crates/iris-core" }
iris-overlay = { path = "crates/iris-overlay" }
arboard = "~3.7"
cc = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
enigo = "~0.6.1"
fs4 = "1.1"
handy-keys = "~0.3.4"
handy-recorder = "~0.1.1"
hound = "3.5"
interprocess = "~2.4"
keyring = "~4.2"
libc = "0.2"
log = "0.4"
open = "5"
psl = "2"
regex = "1"
reqwest = "~0.13"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
signal-hook = "~0.4"
simplelog = "0.12"
slint = { version = "~1.18.1", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "software-renderer-systemfonts",
    "software-renderer-path",
    "accessibility",
    "unstable-winit-030",
] }
slint-build = "~1.18.1"
# 0.19 = winit's copy, so only one SCTK is linked.
smithay-client-toolkit = { version = "~0.19.2", default-features = false, features = ["calloop"] }
strsim = "0.11"
tokio = { version = "1", features = ["rt-multi-thread"] }
transcribe-cpp = { version = "~0.4.2", default-features = false }
url = "2"
uuid = { version = "1", features = ["v4"] }
whatlang = "~0.18"
windows = "~0.61"
tempfile = "3"
